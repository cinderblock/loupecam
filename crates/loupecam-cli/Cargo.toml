[package]
name = "loupecam-cli"
description = "Command-line tool for AmScope / ToupTek USB3 microscope cameras"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Embed the built web UI (apps/web/dist) in the binary.
embed-ui = ["loupecam-server/embed-ui"]
# Software H.264 encoding for recordings (see loupecam-server).
openh264 = ["loupecam-server/openh264"]
# The `kiosk` command: a fullscreen touch UI on the display (Linux DRM/KMS).
kiosk = ["dep:loupecam-kiosk"]
# ...and its desktop-window mode, for development (`kiosk --window`).
kiosk-window = ["kiosk", "loupecam-kiosk/window"]

[[bin]]
name = "loupecam"
path = "src/main.rs"

[dependencies]
loupecam.workspace = true
loupecam-isp.workspace = true
loupecam-server.workspace = true
loupecam-update.workspace = true
loupecam-kiosk = { workspace = true, optional = true }
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
