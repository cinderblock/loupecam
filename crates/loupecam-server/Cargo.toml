[package]
name = "loupecam-server"
description = "Headless network service for AmScope / ToupTek cameras: HTTP/WebSocket API, MJPEG, web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Embed the built web UI (apps/web/dist) into the binary.
embed-ui = ["dep:rust-embed"]

[dependencies]
loupecam.workspace = true
loupecam-isp.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
mime_guess.workspace = true
dirs.workspace = true
jiff.workspace = true
rust-embed = { workspace = true, optional = true }
