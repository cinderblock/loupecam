[package]
name = "loupecam-server"
description = "Headless network service for AmScope / ToupTek cameras: HTTP/WebSocket API, MJPEG, web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Embed the built web UI (apps/web/dist) into the binary.
embed-ui = ["dep:rust-embed"]
# Software H.264 encoding with openh264 (C++, compiled from source). For development and
# platforms without a hardware encoder; not in the musl release builds.
openh264 = ["dep:openh264"]

[dependencies]
loupecam.workspace = true
loupecam-isp.workspace = true
loupecam-update.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tower.workspace = true
openh264 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
mime_guess.workspace = true
dirs.workspace = true
jiff.workspace = true
rust-embed = { workspace = true, optional = true }
mdns-sd.workspace = true
gethostname.workspace = true
argon2.workspace = true
getrandom.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }
