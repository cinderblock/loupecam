name: Release

# Push a tag like v0.2.0 (matching the workspace version) to build, sign and publish
# a release. Every artifact is signed with the release key (TAURI_SIGNING_PRIVATE_KEY);
# the CLI and the desktop app only install updates whose signature verifies.

on:
  push:
    tags: ['v*']
  # Re-run for an existing tag with the current workflow (e.g. after fixing it).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.1
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag matches workspace version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$TAG" ] || { echo "tag $TAG != workspace version $v"; exit 1; }
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "LoupeCam ${TAG#v}" --generate-notes --verify-tag
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: apps/web/dist

  cli:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, exe: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, exe: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/web/dist
      - run: cargo build --release --locked -p loupecam-cli --features embed-ui --target ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - name: Sign and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          name="loupecam-${{ matrix.target }}${{ matrix.exe }}"
          cp "target/${{ matrix.target }}/release/loupecam${{ matrix.exe }}" "$name"
          (cd apps/desktop && bun install --frozen-lockfile && bunx tauri signer sign "../../$name")
          gh release upload "$TAG" "$name" "$name.sig" --clobber

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: ubuntu-22.04, args: '' }
          - { os: macos-latest, args: '--target aarch64-apple-darwin' }
          - { os: macos-latest, args: '--target x86_64-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build, sign, upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/desktop
        run: |
          bunx tauri build ${{ matrix.args }}
          # (macOS ships bash 3.2: no globstar, so use find.)
          # The macOS updater archive (LoupeCam.app.tar.gz) has no architecture in its
          # name, so both macOS builds would collide; add it.
          if [ "$RUNNER_OS" = macOS ]; then
            arch=$(echo "${{ matrix.args }}" | sed 's/.*--target \([a-z0-9_]*\)-.*/\1/')
            find ../../target -path '*/release/bundle/macos/*' -name 'LoupeCam.app.tar.gz*' -type f | while read -r f; do
              mv "$f" "${f/LoupeCam.app/LoupeCam_$arch.app}"
            done
          fi
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find ../../target -path '*/release/bundle/*' -type f \
            \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.app.tar.gz' -o -name '*.dmg' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' \))
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  publish:
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Updater manifest (latest.json) and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --pattern '*.sig'
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          entry() { # platform asset-file
            [ -f "$2.sig" ] || return 0
            printf '"%s": {"signature": %s, "url": "%s/%s"}' "$1" "$(jq -Rs . < "$2.sig")" "$base" "$2"
          }
          pick() { ls -1 $1 2>/dev/null | sed 's/\.sig$//' | head -1; }
          parts=()
          f=$(pick '*-setup.exe.sig');                 [ -n "$f" ] && parts+=("$(entry windows-x86_64 "$f")")
          f=$(pick '*.AppImage.sig');                  [ -n "$f" ] && parts+=("$(entry linux-x86_64 "$f")")
          f=$(pick '*aarch64*.app.tar.gz.sig');        [ -n "$f" ] && parts+=("$(entry darwin-aarch64 "$f")")
          f=$(pick '*x86_64*.app.tar.gz.sig');         [ -n "$f" ] && parts+=("$(entry darwin-x86_64 "$f")")
          notes=$(gh release view "$TAG" --json body --jq .body)
          { printf '{"version": "%s", "notes": %s, "pub_date": "%s", "platforms": {' "${TAG#v}" "$(jq -Rs . <<< "$notes")" "$(date -u +%FT%TZ)"
            (IFS=,; printf '%s' "${parts[*]}")
            printf '}}\n'; } > latest.json
          jq . latest.json
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false --latest
