name: Release

# Releasing = pushing a tag:   git tag -a v1.2.3 -m "LoupeCam 1.2.3" && git push origin v1.2.3
#
# The version comes from the tag (no version-bump commit needed). Tags with a
# pre-release suffix (v1.2.3-rc.1) publish a pre-release that updaters ignore.
#
# Signing, in layers:
#   1. Update signature (always): every artifact is signed with the release key
#      (secret TAURI_SIGNING_PRIVATE_KEY). The CLI and desktop updaters only install
#      artifacts whose signature verifies against the key compiled into them.
#   2. OS code signing (when configured; skipped otherwise):
#      - Windows Authenticode: repository *variable* WINDOWS_SIGN_COMMAND (a command
#        with %1 for the file) plus the provider's secrets, e.g. Azure Artifact Signing:
#        artifact-signing-cli -e <endpoint> -a <account> -c <profile> -d LoupeCam %1
#        with secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID.
#      - macOS Developer ID + notarisation: secrets APPLE_CERTIFICATE (base64 .p12),
#        APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, and for notarisation
#        APPLE_API_ISSUER, APPLE_API_KEY (key id), APPLE_API_PRIVATE_KEY (.p8 contents).
#   3. Integrity (always): SHA256SUMS and GitHub build-provenance attestations
#      (`gh attestation verify <file> -R cinderblock/loupecam`).
#
# Package registries, once the GitHub release is live, each gated on a repository
# variable so a release works before (or without) the registry accounts:
#   - crates.io (PUBLISH_CRATES=true): loupecam-protocol, loupecam, loupecam-isp. Trusted
#     publishing (OIDC); a new crate can't be created that way, so the first release
#     needs the secret CARGO_REGISTRY_TOKEN (delete it afterwards).
#   - PyPI (PUBLISH_PYPI=true): the `loupecam` wheels and sdist, by trusted publishing
#     (a "pending publisher" works for the first release). Environment `pypi`.
#   - npm (PUBLISH_NPM=true): `loupecam` and its per-platform addon packages, with
#     provenance. Trusted publishing once the packages exist; the first release needs
#     the secret NPM_TOKEN.
# Every registry step skips versions already published, so re-running is safe.
# docs/releasing.md has the account setup.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Re-run for an existing tag with the current workflow (e.g. after fixing it).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.3
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bash .github/scripts/set-version.sh
      - id: kind
        run: echo "prerelease=$([[ "$TAG" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "LoupeCam $VERSION" --generate-notes --verify-tag
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

  cli:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, exe: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, exe: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: '' }
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: bash .github/scripts/set-version.sh
        shell: bash
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      # Linux builds include the touchscreen kiosk (`loupecam kiosk`).
      - run: cargo build --release --locked -p loupecam-cli --features "embed-ui${{ contains(matrix.target, 'linux') && ',kiosk' || '' }}" --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          name="loupecam-${{ matrix.target }}${{ matrix.exe }}"
          cp "target/${{ matrix.target }}/release/loupecam${{ matrix.exe }}" "$name"
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - name: Authenticode
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_COMMAND != ''
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          bash .github/scripts/windows-sign.sh setup
          bash .github/scripts/windows-sign.sh "$ASSET"
      - name: Developer ID + notarisation
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          else
            unset APPLE_API_KEY
          fi
          bash .github/scripts/macos-sign.sh "$ASSET"
      - uses: oven-sh/setup-bun@v2
      - name: Update signature and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Over the final (OS-signed) bytes.
          (cd apps/desktop && bun install --frozen-lockfile && bunx tauri signer sign "../../$ASSET")
          gh release upload "$TAG" "$ASSET" "$ASSET.sig" --clobber

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: ubuntu-22.04, args: '' }
          - { os: macos-latest, args: '--target aarch64-apple-darwin' }
          - { os: macos-latest, args: '--target x86_64-apple-darwin' }
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bash .github/scripts/set-version.sh
        shell: bash
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - name: Windows signing setup
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_COMMAND != ''
        shell: bash
        run: |
          bash .github/scripts/windows-sign.sh setup
          # Tauri signs the app, the installers and the uninstaller with this.
          jq -n --arg c "$WINDOWS_SIGN_COMMAND" '{bundle: {windows: {signCommand: $c}}}' > "$RUNNER_TEMP/sign.json"
          echo "TAURI_EXTRA_ARGS=--config $(cygpath -w "$RUNNER_TEMP/sign.json")" >> "$GITHUB_ENV"
      - name: macOS signing setup
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          # Tauri imports the certificate, signs, and notarises (when API keys are set).
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            } >> "$GITHUB_ENV"
          fi
      - name: Build, sign, upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        working-directory: apps/desktop
        run: |
          # shellcheck disable=SC2086 # TAURI_EXTRA_ARGS is intentionally split
          bunx tauri build ${{ matrix.args }} ${TAURI_EXTRA_ARGS:-}
          # (macOS ships bash 3.2: no globstar, so use find.)
          # The macOS updater archive (LoupeCam.app.tar.gz) has no architecture in its
          # name, so both macOS builds would collide; add it.
          if [ "$RUNNER_OS" = macOS ]; then
            arch=$(echo "${{ matrix.args }}" | sed 's/.*--target \([a-z0-9_]*\)-.*/\1/')
            find ../../target -path '*/release/bundle/macos/*' -name 'LoupeCam.app.tar.gz*' -type f | while read -r f; do
              mv "$f" "${f/LoupeCam.app/LoupeCam_$arch.app}"
            done
          fi
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find ../../target -path '*/release/bundle/*' -type f \
            \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.app.tar.gz' -o -name '*.dmg' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' \))
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  # The C API: a zip per platform with the header, shared + static libraries, and the
  # system libraries a static link needs.
  capi:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          # The oldest supported Ubuntu, for the widest glibc compatibility.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: bash .github/scripts/set-version.sh
        shell: bash
      - name: Build
        shell: bash
        run: |
          # No colour: the native-static-libs line is parsed below.
          cargo rustc --color never --release --locked -p loupecam-capi --target ${{ matrix.target }} \
            --crate-type cdylib,staticlib -- --print native-static-libs 2>&1 | tee build.log
          sed -n 's/.*native-static-libs: //p' build.log | head -1 > native-static-libs.txt
          cat native-static-libs.txt
      - name: Stage
        shell: bash
        run: |
          t=${{ matrix.target }}
          dir="loupecam-c-$t"
          rel="target/$t/release"
          mkdir -p "$dir/include" "$dir/lib"
          cp bindings/c/include/loupecam.h "$dir/include/"
          case "$t" in
            *windows*) cp "$rel/loupecam_c.dll" "$rel/loupecam_c.dll.lib" "$rel/loupecam_c.lib" "$dir/lib/" ;;
            *apple*) cp "$rel/libloupecam_c.dylib" "$rel/libloupecam_c.a" "$dir/lib/" ;;
            *) cp "$rel/libloupecam_c.so" "$rel/libloupecam_c.a" "$dir/lib/" ;;
          esac
          cp -r bindings/c/examples "$dir/"
          cp native-static-libs.txt bindings/c/README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          echo "DIR=$dir" >> "$GITHUB_ENV"
      - name: Authenticode
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_COMMAND != ''
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          bash .github/scripts/windows-sign.sh setup
          bash .github/scripts/windows-sign.sh "$DIR/lib/loupecam_c.dll"
      - name: Zip
        shell: bash
        run: |
          if command -v zip >/dev/null; then zip -qr "$DIR.zip" "$DIR"; else 7z a -bd "$DIR.zip" "$DIR"; fi
          echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Update signature and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          (cd apps/desktop && bun install --frozen-lockfile && bunx tauri signer sign "../../$ASSET")
          gh release upload "$TAG" "$ASSET" "$ASSET.sig" --clobber

  # Python wheels (abi3: one per platform covers every CPython 3.10+) and the sdist,
  # for PyPI.
  wheels:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bash .github/scripts/set-version.sh
        shell: bash
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --locked --out dist --manifest-path bindings/python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  sdist:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bash .github/scripts/set-version.sh
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path bindings/python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # The Node.js addon for each platform, for npm.
  node-addons:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: bash .github/scripts/set-version.sh
        shell: bash
      - uses: oven-sh/setup-bun@v2
      - working-directory: bindings/node
        run: |
          bun install --frozen-lockfile
          bunx napi build --platform --release --target ${{ matrix.target }} --js native.js --dts native.d.ts
      - uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node

  publish:
    needs: [prepare, cli, desktop, capi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --pattern '*.sig'
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          entry() { # platform asset-file
            [ -f "$2.sig" ] || return 0
            printf '"%s": {"signature": %s, "url": "%s/%s"}' "$1" "$(jq -Rs . < "$2.sig")" "$base" "$2"
          }
          pick() { ls -1 $1 2>/dev/null | sed 's/\.sig$//' | head -1; }
          parts=()
          f=$(pick '*-setup.exe.sig');                 [ -n "$f" ] && parts+=("$(entry windows-x86_64 "$f")")
          f=$(pick '*.AppImage.sig');                  [ -n "$f" ] && parts+=("$(entry linux-x86_64 "$f")")
          f=$(pick '*aarch64*.app.tar.gz.sig');        [ -n "$f" ] && parts+=("$(entry darwin-aarch64 "$f")")
          f=$(pick '*x86_64*.app.tar.gz.sig');         [ -n "$f" ] && parts+=("$(entry darwin-x86_64 "$f")")
          notes=$(gh release view "$TAG" --json body --jq .body)
          { printf '{"version": "%s", "notes": %s, "pub_date": "%s", "platforms": {' "${TAG#v}" "$(jq -Rs . <<< "$notes")" "$(date -u +%FT%TZ)"
            (IFS=,; printf '%s' "${parts[*]}")
            printf '}}\n'; } > latest.json
          jq . latest.json
          gh release upload "$TAG" latest.json --clobber
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir all && cd all
          gh release download "$TAG" --pattern '*'
          rm -f SHA256SUMS
          sha256sum * > ../SHA256SUMS
          cd .. && mv SHA256SUMS all/ && cat all/SHA256SUMS
          gh release upload "$TAG" all/SHA256SUMS --clobber
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'all/*'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.prepare.outputs.prerelease }}" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi

  # --- Package registries (after the GitHub release is live) -------------------------

  crates:
    needs: [prepare, publish]
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bash .github/scripts/set-version.sh
      # Trusted publishing, unless a token is set (needed to create the crates).
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'
      - run: bash .github/scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  pypi:
    needs: [prepare, publish, wheels, sdist]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/loupecam/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    needs: [prepare, publish, node-addons]
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bash .github/scripts/set-version.sh
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: node-*
          path: bindings/node/artifacts
      - name: Assemble the packages
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          bunx napi create-npm-dirs
          bunx napi artifacts -d artifacts
          # optionalDependencies on the platform packages, which are published below.
          bunx napi pre-publish -t npm --skip-optional-publish
          cat package.json
      - name: Publish
        env:
          # Only for the first release; afterwards trusted publishing (OIDC) is used.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          tag=$([ "$PRERELEASE" = true ] && echo next || echo latest)
          publish() { # directory
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm; skipping"
            else
              (cd "$1" && npm publish --provenance --access public --tag "$tag")
            fi
          }
          for d in npm/*/; do publish "${d%/}"; done
          publish .
