name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bunx tsc -b && bun run lint && bun run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

  rust:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      # The desktop crate needs WebKitGTK on Linux; it has its own job.
      - run: cargo clippy --workspace --exclude loupecam-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude loupecam-desktop
      - run: cargo build --release --locked -p loupecam-cli --features embed-ui
      - uses: actions/upload-artifact@v7
        with:
          name: loupecam-${{ matrix.os }}
          path: |
            target/release/loupecam
            target/release/loupecam.exe

  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - run: cargo build --release -p loupecam-desktop
