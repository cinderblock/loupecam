[package]
name = "amscope-desktop"
description = "Desktop app for AmScope / ToupTek USB3 microscope cameras"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
amscope-server.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Release builds serve the UI compiled into the binary; debug builds read apps/web/dist.
default = ["embed-ui"]
embed-ui = ["amscope-server/embed-ui"]
