[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "bindings/common", "bindings/python"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cinderblock/loupecam"
homepage = "https://github.com/cinderblock/loupecam"
rust-version = "1.88"

[workspace.dependencies]
# The published library crates need a version too (set-version.sh keeps it in step).
loupecam-protocol = { path = "crates/loupecam-protocol", version = "0.1.2" }
loupecam = { path = "crates/loupecam", version = "0.1.2" }
loupecam-isp = { path = "crates/loupecam-isp", version = "0.1.2" }
loupecam-server = { path = "crates/loupecam-server" }
loupecam-update = { path = "crates/loupecam-update" }
loupecam-kiosk = { path = "crates/loupecam-kiosk" }
loupecam-bindings = { path = "bindings/common" }
nusb = "0.2.7"
thiserror = "2"
tracing = "0.1"
bzip2 = "0.6"
clap = { version = "4.6", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rayon = "1.12"
png = "0.18"
tiff = "0.11"
jpeg-encoder = "0.7"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
openh264 = "0.9"
tiny-skia = "0.12"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
fontdue = "0.9"
dejavu = "2.37"
zune-jpeg = "0.5"
ureq = { version = "3", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
winit = "0.30"
softbuffer = "0.4"
drm = "0.15"
evdev = "0.13"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
mime_guess = "2"
dirs = "7"
jiff = "0.2"
rust-embed = "8"
mdns-sd = "0.21"
gethostname = "1"
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
sha2 = "0.10"
rpassword = "7"
windows = "0.61"
pyo3 = "0.30"
numpy = "0.30"
